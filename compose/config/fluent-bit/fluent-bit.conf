# Ships Ranger plugin audit files written by Trino to the ranger_audits index.
# Field renames follow ElasticSearchAuditDestination so Ranger admin reads them (ADR-010).
[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Path              /var/log/ranger/audit/*/*/*.log
    Parser            ranger_json
    Tag               ranger.audit
    Refresh_Interval  5
    Read_from_Head    True
    DB                /var/log/ranger/fluent-bit-tail.db
    Skip_Long_Lines   On
    Mem_Buf_Limit     16MB

[FILTER]
    Name    modify
    Match   ranger.audit
    Rename  cluster_name   cluster
    Rename  zone_name      zoneName
    Rename  policy_version policyVersion

[OUTPUT]
    Name               opensearch
    Match              ranger.audit
    Host               ${OPENSEARCH_HOST}
    Port               ${OPENSEARCH_PORT}
    Index              ranger_audits
    Suppress_Type_Name On
    Replace_Dots       Off
    Generate_ID        Off
    Id_Key             id
    Logstash_Format    Off
    Trace_Error        On
    Retry_Limit        False
