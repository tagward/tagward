name: compose-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["compose/**", "versions.yaml", ".github/workflows/compose-smoke.yml"]
  pull_request:
    paths: ["compose/**", "versions.yaml", ".github/workflows/compose-smoke.yml"]

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m0:
    name: M0 stack up and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: compose
    steps:
      - uses: actions/checkout@v5
      - name: Show tool versions and resources
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          nproc; free -h; df -h / | tail -1
      - name: Configure
        run: cp .env.example .env
      - name: Pull images
        run: docker compose pull --quiet
      - name: Start the stack and wait for health
        run: docker compose up -d --wait --wait-timeout 1200
      - name: Stack state
        if: always()
        run: docker compose ps -a
      - name: Smoke test (M0.2 to M0.6)
        run: bash ./smoke.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p ../artifacts
          docker compose ps -a > ../artifacts/ps.txt
          for s in $(docker compose ps -a --services); do docker compose logs --no-color "$s" > "../artifacts/$s.log" 2>&1 || true; done
          docker compose exec -T trino sh -c 'find /var/log/ranger -type f -name "*.log" -exec sh -c "echo == {}; tail -n 5 {}" \;' > ../artifacts/audit-files.txt 2>&1 || true
          curl -sS http://localhost:9200/ranger_audits/_search?size=5 > ../artifacts/opensearch-ranger_audits.json 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-smoke-logs
          path: artifacts
          if-no-files-found: warn
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
