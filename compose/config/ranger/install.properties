# Mounted at /opt/ranger/admin/install.properties in the upstream apache/ranger image,
# which is what its entrypoint's setup.sh reads. Used until images/ranger-admin exists
# (ADR-008). PostgreSQL for the store, OpenSearch for audit (Ranger admin 2.9.0+), no Solr.
PYTHON_COMMAND_INVOKER=python3
RANGER_ADMIN_LOG_DIR=/var/log/ranger
RANGER_PID_DIR_PATH=/var/run/ranger
RANGER_ADMIN_LOGBACK_CONF_FILE=/opt/ranger/admin/ews/webapp/WEB-INF/classes/conf/logback.xml
DB_FLAVOR=POSTGRES
SQL_CONNECTOR_JAR=/usr/share/java/postgresql.jar
db_root_user=postgres
db_root_password=postgres
db_host=postgres
db_name=ranger
db_user=ranger
db_password=ranger
postgres_core_file=db/postgres/optimized/current/ranger_core_db_postgres.sql
postgres_audit_file=db/postgres/xa_audit_db_postgres.sql
rangerAdmin_password=Ranger4dm1n!
rangerTagsync_password=Ranger4dm1n!
rangerUsersync_password=Ranger4dm1n!
keyadmin_password=Ranger4dm1n!
audit_store=opensearch
audit_opensearch_urls=opensearch
audit_opensearch_port=9200
audit_opensearch_protocol=http
audit_opensearch_user=
audit_opensearch_password=
audit_opensearch_index=ranger_audits
audit_opensearch_bootstrap_enabled=false
policymgr_external_url=http://localhost:6080
policymgr_http_enabled=true
authentication_method=NONE
unix_user=ranger
unix_user_pwd=ranger
unix_group=ranger
XAPOLICYMGR_DIR=$PWD
app_home=$PWD/ews/webapp
TMPFILE=$PWD/.fi_tmp
LOGFILE=$PWD/logfile
LOGFILES="$LOGFILE"
JAVA_BIN='java'
JAVA_VERSION_REQUIRED='1.8'
ranger_admin_max_heap_size=1g
PATCH_RETRY_INTERVAL=120
STALE_PATCH_ENTRY_HOLD_TIME=10
hadoop_conf=
cred_keystore_filename=
oracle_core_file=
sqlserver_core_file=
sqlanywhere_core_file=
mysql_core_file=
mysql_audit_file=
